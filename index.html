<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Launchpad</title>
<style>
  :root{
    --bg:#f4f6f9; --card:#ffffff; --ink:#1f2733; --muted:#5b6675;
    --navy:#0E4D92; --line:#e3e8ef; --chip:#eef3f9; --shadow:0 1px 2px rgba(16,24,40,.06);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#101418; --card:#1a2027; --ink:#e8edf3; --muted:#9aa7b5;
           --navy:#6ea8dc; --line:#2a323c; --chip:#232b35; --shadow:0 1px 2px rgba(0,0,0,.4); }
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--bg); color:var(--ink);
       font:15px/1.45 "Segoe UI", Calibri, system-ui, sans-serif;}
  .wrap{max-width:1180px; margin:0 auto; padding:36px 28px 60px;}
  header{display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; margin-bottom:6px;}
  h1{font-size:22px; font-weight:650; margin:0;}
  #date{color:var(--muted); font-size:14px;}
  #search{margin-left:auto; width:260px; padding:8px 12px; font:inherit;
          border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--ink);}
  #search:focus{outline:2px solid var(--navy); outline-offset:-1px;}
  #edit{font-size:13px; color:var(--navy); text-decoration:none; border:1px solid var(--line);
        border-radius:8px; padding:7px 12px; background:var(--card); white-space:nowrap;}
  #edit:hover{border-color:var(--navy);}
  #lock{font-size:14px; border:1px solid var(--line); border-radius:8px; padding:6px 11px;
        background:var(--card); cursor:pointer; color:var(--ink);}
  #lock:hover{border-color:var(--navy);}
  .unlock{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:12px 0 0;}
  .unlock input[type=password]{padding:8px 12px; font:inherit; border:1px solid var(--line);
        border-radius:8px; background:var(--card); color:var(--ink); width:220px;}
  .unlock label{font-size:13px; color:var(--muted); display:flex; gap:6px; align-items:center;}
  .unlock button{font:inherit; font-size:13px; padding:8px 14px; border:1px solid var(--line);
        border-radius:8px; background:var(--card); color:var(--navy); cursor:pointer;}
  .unlock button:hover{border-color:var(--navy);}
  #unlockErr{font-size:13px; color:#c0392b;}
  h2{font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted);
     margin:30px 0 12px; font-weight:600;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(215px,1fr)); gap:12px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:12px;
        padding:14px 16px; cursor:pointer; box-shadow:var(--shadow);
        display:flex; flex-direction:column; gap:4px; min-height:92px;
        transition:transform .08s ease, border-color .08s ease;}
  .card:hover, .card:focus-visible{transform:translateY(-2px); border-color:var(--navy); outline:none;}
  .card .top{display:flex; align-items:center; gap:10px;}
  .card .ico{font-size:20px; line-height:1;}
  .card .name{font-weight:600; font-size:15px;}
  .card .desc{color:var(--muted); font-size:13px;}
  .card .foot{margin-top:auto; display:flex; gap:6px; align-items:center; padding-top:6px;}
  .chip{font-size:11px; color:var(--muted); background:var(--chip); border-radius:6px; padding:2px 8px;}
  .hidden{display:none !important;}
  footer{margin-top:44px; color:var(--muted); font-size:12px;}
  footer a{color:var(--navy);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Launchpad</h1>
    <span id="date"></span>
    <input id="search" type="search" placeholder="Filter…  ( / )" autocomplete="off">
    <a id="edit" href="https://github.com/gwaterhouse8/gwaterhouse8.github.io/edit/main/index.html"
       target="_blank" rel="noopener" title="Add or remove blocks — one line each in SECTIONS">✏️ Edit</a>
    <button id="lock" title="Private section">🔒</button>
  </header>
  <div id="unlockPanel" class="unlock hidden">
    <input id="passIn" type="password" placeholder="Passphrase" autocomplete="off">
    <button id="unlockBtn">Unlock</button>
    <label><input id="rememberK" type="checkbox" checked> remember this device</label>
    <span id="unlockErr"></span>
  </div>
  <div id="sections"></div>
  <footer>To add or change a block, edit the SECTIONS list at the top of
    <a href="https://github.com/gwaterhouse8/gwaterhouse8.github.io/edit/main/index.html">index.html</a> in the repo.</footer>
</div>

<script>
/* ================= EDIT YOUR BLOCKS HERE =================
   Block fields: icon, name, desc, url.
   For an app that only lives on this machine, use `path` instead of `url`
   (browsers block file:// links from an https page) — clicking copies the
   path so you can paste it straight into the address bar.                */

const SECTIONS = [
  { title: "Work", blocks: [
    { icon:"🔥", name:"Forge",              desc:"CRM dashboard",                 url:"http://159.65.233.101:8081" },
    { icon:"📊", name:"Live Stats",         desc:"Team sourcing stats page",      url:"http://159.65.233.101:8081/stats" },
    { icon:"📄", name:"Staffing Generator", desc:"CIM / teaser → staffing email", url:"http://159.65.233.101:8081/staffing" },
  ]},
  { title: "Startup", blocks: [
    { icon:"📘", name:"Research Doc",   desc:"Living analysis doc",     url:"https://docs.google.com/document/d/1LzawmappKUFQSAg3QYs-XV9QyC-OHvArMudwC5uLndA/edit" },
    { icon:"🗂️", name:"Knowledge Base", desc:"Drive folder",            url:"https://drive.google.com/drive/folders/1ov_SQ9Fpvjl28216f6ZD82X72Y7Wi7Q6" },
    { icon:"🧾", name:"Evidence Index", desc:"Master index of sources", url:"https://docs.google.com/document/d/1C8TodX-pjwgWMzFa1QIdIGdyYNQ-rhnF3sJNIsilVyQ/edit" },
  ]},
  { title: "Personal", blocks: [
    { icon:"🤝", name:"Network Intro",        desc:"LinkedIn intro app",     url:"https://networkintro.167.71.31.0.sslip.io" },
    { icon:"🐙", name:"GitHub",               desc:"All repos",              url:"https://github.com/gwaterhouse8?tab=repositories" },
  ]},
];

/* Private section — AES-256-GCM ciphertext; the passphrase is NOT in this file.
   To change its contents, re-encrypt and replace this blob. */
const PRIVATE_ENC = {
  salt: "P3G8h0amS4PODXPwYyZuGA==",
  iv:   "dX1njJuYfdKov6xB",
  ct:   "LkBjrk2G4zGs2CK94aBDN5CzUPjeZ/tuPxT145Y9RLspyX77oX6uLR6SJzREdduQd3KREoG/hN81vVdA86zFh049Bu3nkUW2Q0n4jJgZiKE4wVVeHZbyoiiY7YKBqZIo1PiYGi0h4/70p7CnXRKPi0Vp19MLUSqUcJ0K3oumO3R6H3Y0VVLdnz2/j5BteR2ASVpXMQ6aK4LvK/Ts+o4MN1SdYr35Ewz05HBxTQ/oTgYUoOVS9pTVVhpZX932IyqWQg5NKB2O8WiNX4WWgqjDo1HbJPMRcudgjo5vAsLvOvUtAdScXftnxdRRMo5WqZdFeNAh6WGF+++Pio6S9H7etCRideXf6bVBAt1OFtXbjOv2pqSziOlw+2/2HEJmcU0DSjXkvQdnyyY55+7Dys1EQDyIHJS4UPLHfovzcnof6l1ohSSqW8uHUYiKCU+OgenzUmu3YmWW3TS53ZSDRubCqA/4i0GUbYTx9zcmXtPJ460GR1kaWWQzmDkB51VL2DIwm59osLqC/+0MQ8vhGR5CJHYzx0R8WJogbghTg6azfZBSU9ZjltUEhrcECePpfMt15/nod3j0hw9zQthHUw9AqxWLRx2rHD6cMcWzxqeIiuRo2mFg7VIb3Zjyw9aFv0G1shPNBKX2167RkAx++9XHEAorapgEKAbSs3EQZ1iCGUXhG3h0NE4k+faN9jlFl/iXb9orCNbYeJHqaLV20vG7a1VzdwJNcM/xMuWwYDZLEclscHbtezgjENSI9Cyw08o53BYF/iuSymnP1iq14q18v9OgjELVoNS9rPUm5Lb5eCURYSYRkXXY5b/hgBQfXuza8GcxlqqswNxmtZSmtlqoqhLRJEiXUM9Mh5kzaT4FQ4L/aGpba7pw3syWflnFP+s6X/gJBtsj1KjY82hNBqfh+HL2OBWEFIo+V4DpgtPaka8V1eB9KoIh9NSf2Q7xvcxdRruXuOyQinuwh7nYBigTHXGJ1jk9oE+hs+vhd4kgZXFeW+CsnKvjwtcfiPTelh17jtkKvdqC5jh+mn6urUe8aHMJA5d/Vwefr64q7QqnB2vpN2HuUk+LNgLVYOJILwoxyz22W3TjWx5epR4U/yVwjYOFrCpkn/1A/b0wbkfK+Xqu6cL5CdC1y52Fg+N+IsohttZ+6ia3mGEaHMZnrLgKknhbD838JHOpIe9eVwzRMP5gX/vkbwpXKq0g91mEC09uypSE+4mVbsmU1TLmydB3uCw2oIW3cA+PQD5qn9btJjuOe+WxGC0WIAw23fqhqwlLWEul7D6t/UmB0Qc5J5k7XW0j325BHa/WFjCL5dnyMmJUcV5v8nOPdw=="
};

/* ================= no need to edit below ================= */

function chipFor(url){
  try { return new URL(url).hostname.replace(/^www\./,""); } catch(e){ return ""; }
}

function renderSection(sec){
  const wrap = document.createElement("section");
  const h = document.createElement("h2");
  h.textContent = sec.title;
  const grid = document.createElement("div");
  grid.className = "grid";
  for (const b of sec.blocks){
    const card = document.createElement("div");
    card.className = "card";
    card.tabIndex = 0;
    card.dataset.url = b.url || "";
    if (b.path) card.dataset.path = b.path;
    card.dataset.q = (b.name + " " + b.desc).toLowerCase();

    const top = document.createElement("div"); top.className = "top";
    const ico = document.createElement("span"); ico.className = "ico"; ico.textContent = b.icon || "🔗";
    const name = document.createElement("span"); name.className = "name"; name.textContent = b.name;
    top.append(ico, name);

    const desc = document.createElement("div"); desc.className = "desc"; desc.textContent = b.desc || "";

    const foot = document.createElement("div"); foot.className = "foot";
    const chip = document.createElement("span"); chip.className = "chip";
    chip.textContent = b.path ? "on this PC — click to copy path" : chipFor(b.url);
    foot.append(chip);

    card.append(top, desc, foot);
    grid.append(card);
  }
  wrap.append(h, grid);
  return wrap;
}

const host = document.getElementById("sections");
for (const sec of SECTIONS) host.append(renderSection(sec));

/* one delegated handler — no inline on* attributes; opens links in a NEW tab */
async function copyPath(card){
  const chip = card.querySelector(".chip");
  const was = chip.textContent;
  try{
    await navigator.clipboard.writeText(card.dataset.path);
    chip.textContent = "copied — paste in address bar";
  } catch(e){
    chip.textContent = "copy blocked — path in console";
    console.log(card.dataset.path);
  }
  setTimeout(() => { chip.textContent = was; }, 2600);
}
function openCard(card){
  if (card.dataset.path){ copyPath(card); return; }
  window.open(card.dataset.url, "_blank", "noopener");
}
host.addEventListener("click", e => {
  const card = e.target.closest(".card");
  if (card) openCard(card);
});
host.addEventListener("keydown", e => {
  if (e.key === "Enter"){
    const card = e.target.closest(".card");
    if (card) openCard(card);
  }
});

/* filter */
const searchEl = document.getElementById("search");
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== searchEl){ e.preventDefault(); searchEl.focus(); }
});
searchEl.addEventListener("input", () => {
  const q = searchEl.value.trim().toLowerCase();
  document.querySelectorAll("#sections section").forEach(sec => {
    let any = false;
    sec.querySelectorAll(".card").forEach(c => {
      const show = !q || c.dataset.q.includes(q);
      c.classList.toggle("hidden", !show);
      if (show) any = true;
    });
    sec.classList.toggle("hidden", !any);
  });
});

/* ---- private section: decrypt-in-browser (WebCrypto) ---- */
const lockBtn = document.getElementById("lock");
const panel = document.getElementById("unlockPanel");
const passIn = document.getElementById("passIn");
const remember = document.getElementById("rememberK");
const unlockErr = document.getElementById("unlockErr");
let privateOn = false;

const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function keyFromPass(pass){
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b64d(PRIVATE_ENC.salt), iterations:300000, hash:"SHA-256"},
    km, {name:"AES-GCM", length:256}, true, ["decrypt"]);
}
async function decryptPrivate(key){
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64d(PRIVATE_ENC.iv)}, key, b64d(PRIVATE_ENC.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
function showPrivate(secs){
  for (const s of secs){ const el = renderSection(s); el.classList.add("psec"); host.append(el); }
  privateOn = true; lockBtn.textContent = "🔓";
  panel.classList.add("hidden"); passIn.value = ""; unlockErr.textContent = "";
}
function hidePrivate(){
  document.querySelectorAll(".psec").forEach(e => e.remove());
  privateOn = false; lockBtn.textContent = "🔒";
}
async function tryUnlock(){
  unlockErr.textContent = "";
  try{
    const key = await keyFromPass(passIn.value.trim());
    const secs = await decryptPrivate(key);
    if (remember.checked){
      const raw = await crypto.subtle.exportKey("raw", key);
      localStorage.setItem("lp.k", btoa(String.fromCharCode(...new Uint8Array(raw))));
    }
    showPrivate(secs);
  } catch(e){ unlockErr.textContent = "Wrong passphrase"; }
}
/* 🔒 click: if this device holds a remembered key, one click reveals; else ask.
   Never auto-shows on page load (screen-share safe). 🔓 or Esc hides again. */
lockBtn.addEventListener("click", async () => {
  if (privateOn){ hidePrivate(); return; }
  const saved = localStorage.getItem("lp.k");
  if (saved){
    try{
      const key = await crypto.subtle.importKey("raw", b64d(saved), {name:"AES-GCM"}, false, ["decrypt"]);
      showPrivate(await decryptPrivate(key));
      return;
    } catch(e){ localStorage.removeItem("lp.k"); }
  }
  panel.classList.toggle("hidden");
  if (!panel.classList.contains("hidden")) passIn.focus();
});
document.getElementById("unlockBtn").addEventListener("click", tryUnlock);
passIn.addEventListener("keydown", e => { if (e.key === "Enter") tryUnlock(); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape"){ hidePrivate(); panel.classList.add("hidden"); }
});

document.getElementById("date").textContent =
  new Date().toLocaleDateString("en-US", { weekday:"long", month:"long", day:"numeric" });
</script>
</body>
</html>
