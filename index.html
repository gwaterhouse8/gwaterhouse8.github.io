<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Launchpad</title>
<style>
  :root{
    --bg:#f4f6f9; --card:#ffffff; --ink:#1f2733; --muted:#5b6675;
    --navy:#0E4D92; --line:#e3e8ef; --chip:#eef3f9; --shadow:0 1px 2px rgba(16,24,40,.06);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#101418; --card:#1a2027; --ink:#e8edf3; --muted:#9aa7b5;
           --navy:#6ea8dc; --line:#2a323c; --chip:#232b35; --shadow:0 1px 2px rgba(0,0,0,.4); }
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--bg); color:var(--ink);
       font:15px/1.45 "Segoe UI", Calibri, system-ui, sans-serif;}
  .wrap{max-width:1180px; margin:0 auto; padding:36px 28px 60px;}
  header{display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; margin-bottom:6px;}
  h1{font-size:22px; font-weight:650; margin:0;}
  #date{color:var(--muted); font-size:14px;}
  #search{margin-left:auto; width:260px; padding:8px 12px; font:inherit;
          border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--ink);}
  #search:focus{outline:2px solid var(--navy); outline-offset:-1px;}
  #edit{font-size:13px; color:var(--navy); text-decoration:none; border:1px solid var(--line);
        border-radius:8px; padding:7px 12px; background:var(--card); white-space:nowrap;}
  #edit:hover{border-color:var(--navy);}
  #lock{font-size:14px; border:1px solid var(--line); border-radius:8px; padding:6px 11px;
        background:var(--card); cursor:pointer; color:var(--ink);}
  #lock:hover{border-color:var(--navy);}
  .unlock{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:12px 0 0;}
  .unlock input[type=password]{padding:8px 12px; font:inherit; border:1px solid var(--line);
        border-radius:8px; background:var(--card); color:var(--ink); width:220px;}
  .unlock label{font-size:13px; color:var(--muted); display:flex; gap:6px; align-items:center;}
  .unlock button{font:inherit; font-size:13px; padding:8px 14px; border:1px solid var(--line);
        border-radius:8px; background:var(--card); color:var(--navy); cursor:pointer;}
  .unlock button:hover{border-color:var(--navy);}
  #unlockErr{font-size:13px; color:#c0392b;}
  h2{font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted);
     margin:30px 0 12px; font-weight:600;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(215px,1fr)); gap:12px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:12px;
        padding:14px 16px; cursor:pointer; box-shadow:var(--shadow);
        display:flex; flex-direction:column; gap:4px; min-height:92px;
        transition:transform .08s ease, border-color .08s ease;}
  .card:hover, .card:focus-visible{transform:translateY(-2px); border-color:var(--navy); outline:none;}
  .card .top{display:flex; align-items:center; gap:10px;}
  .card .ico{font-size:20px; line-height:1;}
  .card .name{font-weight:600; font-size:15px;}
  .card .desc{color:var(--muted); font-size:13px;}
  .card .foot{margin-top:auto; display:flex; gap:6px; align-items:center; padding-top:6px;}
  .chip{font-size:11px; color:var(--muted); background:var(--chip); border-radius:6px; padding:2px 8px;}
  .pathout{display:block; font-size:11px; line-height:1.35; color:var(--ink); background:var(--chip);
        border:1px solid var(--line); border-radius:6px; padding:6px 8px; margin:6px 0 2px;
        word-break:break-all; user-select:all; cursor:text;
        font-family:Consolas, ui-monospace, monospace;}
  /* --- public company reviews: one tile, many tickers --- */
  .revwrap{display:grid; grid-template-columns:minmax(0,640px); gap:12px;}
  .card.revtile{cursor:default; padding:14px 0 10px; gap:0;}
  .card.revtile:hover{transform:none; border-color:var(--line);}
  .revhead{display:flex; align-items:center; gap:10px; padding:0 16px 10px;}
  .revhead .ico{font-size:18px; line-height:1;}
  .revhead .name{font-weight:600; font-size:15px;}
  .rcount{margin-left:auto; font-size:11px; color:var(--muted);
        background:var(--chip); border-radius:6px; padding:2px 8px; white-space:nowrap;}
  .rcolhead{display:grid; grid-template-columns:62px 1fr 62px 74px 62px 62px; gap:8px;
        padding:0 16px 5px; font-size:9.5px; letter-spacing:.07em; text-transform:uppercase;
        color:var(--muted); border-bottom:1px solid var(--line);}
  .rcolhead .r{text-align:right;}
  .rlist{max-height:340px; overflow-y:auto;}  /* superseded below */
  .rrow{display:grid; grid-template-columns:62px 1fr 62px 74px 62px 62px; gap:8px;
        align-items:center; padding:9px 16px; cursor:pointer;
        border-bottom:1px solid var(--line); transition:background .08s ease;}
  .rlist .rrow:last-child{border-bottom:0;}
  .rrow:hover, .rrow:focus-visible{background:var(--chip); outline:none;}
  .rrow:focus-visible{box-shadow:inset 2px 0 0 var(--navy);}
  .rtick{font:650 13.5px/1.2 Consolas, ui-monospace, monospace; letter-spacing:.02em;}
  .rco{color:var(--muted); font-size:12.5px; overflow:hidden; text-overflow:ellipsis;
        white-space:nowrap;}
  .rcall{font-size:9px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
        padding:2px 0; border-radius:5px; text-align:center;}
  .call-buy{background:#e2f1ea; color:#17845a;}
  .call-hold{background:#f6eedd; color:#8a6212;}
  .call-avoid{background:#f9e5e1; color:#bc3b22;}
  .rlast{font:600 13.5px/1.2 Consolas, ui-monospace, monospace; text-align:right;
        font-variant-numeric:tabular-nums;}
  .rchg{font:700 13.5px/1.2 Consolas, ui-monospace, monospace; text-align:right;
        font-variant-numeric:tabular-nums;}
  /* the day's open-to-close move; lighter than vs-pitch, which is the call */
  .rday{font:600 12px/1.2 Consolas, ui-monospace, monospace; text-align:right;
        font-variant-numeric:tabular-nums;}
  .rlist{max-height:420px;}
  .rgroup{position:sticky; top:0; z-index:1; background:var(--card);
        display:flex; align-items:baseline; gap:8px; padding:9px 16px 5px;
        border-bottom:1px solid var(--line);}
  .rgroup .gt{font-size:10px; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
        color:var(--navy);}
  .rgroup .gn{font-size:11px; color:var(--muted); overflow:hidden; text-overflow:ellipsis;
        white-space:nowrap;}
  .rrow.queued{cursor:default;}
  .rrow.queued:hover{background:transparent;}
  .rrow.queued .rtick, .rrow.queued .rco{opacity:.62;}
  .call-queued{background:var(--chip); color:var(--muted); font-weight:600;}
  .dash{color:var(--muted); opacity:.45;}
  .dual{color:var(--navy); font-size:11px; vertical-align:super; margin-left:3px;}
  .revfoot{padding:9px 16px 0; font-size:11px; color:var(--muted);}
  .revempty{padding:14px 16px; font-size:13px; color:var(--muted);}
  .up{color:#17845a;} .down{color:#bc3b22;} .flat{color:var(--muted);}
  @media (max-width:560px){
    /* Six columns will not fit a phone, so Company drops out as before. The
       rest are tightened and the gap halved: a four-digit price plus two
       signed percentages is the widest this row ever gets, and the list's own
       scrollbar takes width off the grid too. */
    .rcolhead, .rrow{grid-template-columns:44px 48px 66px 46px 48px; gap:4px;}
    .rco, .rcolhead .co{display:none;}
    .rcolhead{font-size:9px; letter-spacing:.04em;}
    .rlast, .rchg{font-size:12px;}
    .rday{font-size:11px;}
    .rcall{font-size:8.5px; letter-spacing:.03em;}
  }
  @media (prefers-color-scheme: dark){
    .call-buy{background:#13291f; color:#33a876;}
    .call-hold{background:#2e2717; color:#c79b3e;}
    .call-avoid{background:#341f1a; color:#e2664a;}
    .up{color:#33a876;} .down{color:#e2664a;}
  }
  .hidden{display:none !important;}
  footer{margin-top:44px; color:var(--muted); font-size:12px;}
  footer a{color:var(--navy);}
</style>

function chipFor(url){
  try { return new URL(url).hostname.replace(/^www\./,""); } catch(e){ return ""; }
}

function renderSection(sec){
  const wrap = document.createElement("section");
  const h = document.createElement("h2");
  h.textContent = sec.title;
  const grid = document.createElement("div");
  grid.className = "grid";
  for (const b of sec.blocks){
    const card = document.createElement("div");
    card.className = "card";
    card.tabIndex = 0;
    card.dataset.url = b.url || "";
    if (b.path) card.dataset.path = b.path;
    card.dataset.q = (b.name + " " + b.desc).toLowerCase();

    const top = document.createElement("div"); top.className = "top";
    const ico = document.createElement("span"); ico.className = "ico"; ico.textContent = b.icon || "🔗";
    const name = document.createElement("span"); name.className = "name"; name.textContent = b.name;
    top.append(ico, name);

    const desc = document.createElement("div"); desc.className = "desc"; desc.textContent = b.desc || "";

    const foot = document.createElement("div"); foot.className = "foot";
    const chip = document.createElement("span"); chip.className = "chip";
    chip.textContent = b.path ? "on this PC — click to copy path" : chipFor(b.url);
    foot.append(chip);

    card.append(top, desc, foot);
    grid.append(card);
  }
  wrap.append(h, grid);
  return wrap;
}

/* Reviews render into the same host and reuse .card, so the delegated click

function fmtDate(iso){
  const [y,m,d] = iso.split("-").map(Number);
  return new Date(Date.UTC(y, m-1, d)).toLocaleDateString("en-GB",
    { day:"numeric", month:"short", year:"2-digit", timeZone:"UTC" });
}

  const holder = document.createElement("div");

  // section stays the same height whether it holds 1 name or 100.
  const card = document.createElement("div");
  card.className = "card revtile";
  const qRows = queue.flatMap(g => g.rows);
  card.dataset.q = list.concat(qRows).map(r => r.ticker + " " + r.company)
    .join(" ").toLowerCase();

  const head = document.createElement("div"); head.className = "revhead";
  const ico = document.createElement("span"); ico.className = "ico"; ico.textContent = "\uD83D\uDCC8";
  const nm  = document.createElement("span"); nm.className = "name"; nm.textContent = "Tracked calls";
  const cnt = document.createElement("span"); cnt.className = "rcount";
  cnt.textContent = countLabel(list.length, qRows.length);
  head.append(ico, nm, cnt);
  card.append(head);

  const ch = document.createElement("div"); ch.className = "rcolhead";
  ["Ticker", "Company", "Call", "Close", "Day", "vs pitch"].forEach((t, k) => {
    const c = document.createElement("span");
    if (k === 1) c.className = "co";      // hidden on narrow, like the row cell
    if (k >= 2) c.className = "r";
    c.textContent = t;
    ch.append(c);
  });
  card.append(ch);

  const listEl = document.createElement("div"); listEl.className = "rlist";
  let g = 0;

  if (list.length){
    listEl.append(groupHead("Reviewed", "", "g" + g));
    for (const r of list) listEl.append(reviewRow(r, "g" + g));
    g++;
  }
  for (const grp of queue){
    listEl.append(groupHead(grp.theme, grp.note, "g" + g));
    for (const q of grp.rows) listEl.append(queueRow(q, "g" + g));
    g++;
  }
  card.append(listEl);

  const foot = document.createElement("div"); foot.className = "revfoot";
  foot.textContent = "Close and Day are the session's official open and close; "
    + "vs pitch is measured from the close on the pitch date"
    + (ASOF ? ", marked to " + fmtDate(ASOF) : "")
    + ". Click a reviewed row for the memo.";
  card.append(foot);

  holder.append(card);
  wrap.append(h, holder);
  return wrap;
}

function countLabel(n, q){
  return n + " reviewed" + (q ? " \u00b7 " + q + " queued" : "");
}

function groupHead(title, note, gid){
  const d = document.createElement("div");
  d.className = "rgroup";
  d.dataset.grp = gid;
  const t = document.createElement("span"); t.className = "gt"; t.textContent = title;
  d.append(t);
  if (note){ const n = document.createElement("span"); n.className = "gn"; n.textContent = note; d.append(n); }
  return d;
}

/* A mark is {d, o, c} from prices.json, or the seeded {d, p} baseline. */
const px = m => (m && m.c != null ? m.c : (m ? m.p : null));

/* Seeded baseline first, then anything prices.json holds for that date wins.
   Merging rather than replacing means the pitch-date mark survives even when
   the fetched series starts later. */
function seriesFor(r){
  const by = new Map();
  for (const m of (r.marks || [])) by.set(m.d, m);
  for (const m of (PRICES[r.ticker] || [])) by.set(m.d, m);
  return [...by.keys()].sort().map(d => by.get(d));
}

const dirOf = pct => (Math.abs(pct) < 0.05 ? "flat" : (pct > 0 ? "up" : "down"));

function reviewRow(r, gid){
  const marks = seriesFor(r);
  const last  = marks[marks.length - 1];
  const pct   = ((px(last) - r.entry) / r.entry) * 100;
  const dir   = dirOf(pct);
  /* The day's own move. Only marks carrying an open can show one -- the
     seeded baselines hold a close alone, so those show a dash, not a zero. */
  const day = (last && last.o != null && last.c != null)
            ? ((last.c - last.o) / last.o) * 100 : null;

  const row = document.createElement("div");
  row.className = "rrow";
  row.tabIndex = 0;
  row.dataset.url = r.url || "";
  row.dataset.grp = gid;
  row.dataset.rowQ = (r.ticker + " " + r.company + " " + r.call + " " + r.thesis).toLowerCase();
  row.title = r.ticker + " \u2014 pitched $" + r.entry.toFixed(2) + " on " + fmtDate(r.pitched)
            + " \u00b7 last $" + px(last).toFixed(2) + " on " + fmtDate(last.d)
            + (day !== null ? " (open $" + last.o.toFixed(2) + " \u2192 close $"
                              + last.c.toFixed(2) + ")" : "")
            + " \u00b7 fair value " + r.fair
            + " \u00b7 " + marks.length + " session" + (marks.length === 1 ? "" : "s")
            + " tracked\n" + r.thesis;

  const tk = document.createElement("span"); tk.className = "rtick"; tk.textContent = r.ticker;
  const co = document.createElement("span"); co.className = "rco"; co.textContent = r.company;
  const cl = document.createElement("span");
  cl.className = "rcall call-" + r.call.toLowerCase(); cl.textContent = r.call;
  const lp = document.createElement("span"); lp.className = "rlast";
  lp.textContent = "$" + px(last).toFixed(2);
  const dy = document.createElement("span");
  if (day === null){ dy.className = "rday dash"; dy.textContent = "\u2013"; }
  else { dy.className = "rday " + dirOf(day);
         dy.textContent = (day > 0 ? "+" : "") + day.toFixed(1) + "%"; }
  const cg = document.createElement("span"); cg.className = "rchg " + dir;
  cg.textContent = (pct > 0 ? "+" : "") + pct.toFixed(1) + "%";

  row.append(tk, co, cl, lp, dy, cg);
  return row;
}

/* Queued names carry no call and no price. No data-url and no tabIndex, so the
   delegated handler skips them and they are not reachable by keyboard. */
function queueRow(q, gid){
  const row = document.createElement("div");
  row.className = "rrow queued";
  row.dataset.grp = gid;
  row.dataset.rowQ = (q.ticker + " " + q.company + " " + q.why + " " + (q.also || "")).toLowerCase();
  row.title = q.ticker + " \u2014 queued for review\n" + q.why + (q.also ? "\n" + q.also : "");

  const tk = document.createElement("span"); tk.className = "rtick"; tk.textContent = q.ticker;
  const co = document.createElement("span"); co.className = "rco";
  co.textContent = q.company;
  if (q.also){ const d = document.createElement("span"); d.className = "dual"; d.textContent = "\u2217"; co.append(d); }
  const cl = document.createElement("span"); cl.className = "rcall call-queued"; cl.textContent = "Queued";
  const lp = document.createElement("span"); lp.className = "rlast dash"; lp.textContent = "\u2013";
  const dy = document.createElement("span"); dy.className = "rday dash"; dy.textContent = "\u2013";
  const cg = document.createElement("span"); cg.className = "rchg dash"; cg.textContent = "\u2013";

  row.append(tk, co, cl, lp, dy, cg);
  return row;
}

const host = document.getElementById("sections");
for (const sec of SECTIONS){
  host.append(renderSection(sec));
}
/* Public Company Reviews sit at the very bottom of the page. Unlocked private
   sections insert ABOVE this node (see showPrivate) so it stays last whether
   the page is locked or not. */
host.append(renderReviews(REVIEWS, QUEUE));

/* one delegated handler — no inline on* attributes; opens links in a NEW tab */
/* Clipboard API needs a secure context + user gesture; execCommand is the
   fallback. Either way the path is also revealed as selectable text, so the
   card is never a dead end. */
async function writeClip(text){
  try{
    if (navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch(e){ /* fall through */ }
  try{
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;";
    document.body.append(ta);
    ta.select();
    const ok = document.execCommand("copy");
    ta.remove();
    return ok;
  } catch(e){ return false; }
}
async function copyPath(card){
  const chip = card.querySelector(".chip");
  const path = card.dataset.path;
  let out = card.querySelector(".pathout");
  if (!out){
    out = document.createElement("code");
    out.className = "pathout";
    card.querySelector(".desc").after(out);
  }
  out.textContent = path;
  const ok = await writeClip(path);
  chip.textContent = ok ? "copied — paste in address bar"
                        : "select the path above and copy it";
  clearTimeout(card._t);
  card._t = setTimeout(() => {
    chip.textContent = "on this PC — click to copy path";
    out.remove();
  }, 9000);
}
function openCard(card){
  if (card.dataset.path){ copyPath(card); return; }
  window.open(card.dataset.url, "_blank", "noopener");
}
/* closest("[data-url]") resolves innermost-first, so a review row wins over
   the tile that holds it; ordinary cards carry data-url themselves and are
   unaffected. The review tile has no data-url, so its chrome is inert. */
host.addEventListener("click", e => {
  if (e.target.closest(".pathout")) return;   // let the path be selected by hand
  const el = e.target.closest("[data-url]");
  if (el) openCard(el);
});
host.addEventListener("keydown", e => {
  if (e.key === "Enter"){
    const el = e.target.closest("[data-url]");
    if (el) openCard(el);
  }
});

/* filter */
const searchEl = document.getElementById("search");
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== searchEl){ e.preventDefault(); searchEl.focus(); }
});
searchEl.addEventListener("input", () => {
  const q = searchEl.value.trim().toLowerCase();
  document.querySelectorAll("#sections section").forEach(sec => {
    let any = false;
    sec.querySelectorAll(".card").forEach(c => {
      const rows = c.querySelectorAll("[data-row-q]");
      let show;
      if (rows.length){
        let hit = 0;
        rows.forEach(r => {
          const ok = !q || r.dataset.rowQ.includes(q);
          r.classList.toggle("hidden", !ok);
          if (ok) hit++;
        });
        show = hit > 0;
        // hide a group header once every row under it is filtered out
        c.querySelectorAll(".rgroup").forEach(gh => {
          const any = [...c.querySelectorAll('.rrow[data-grp="' + gh.dataset.grp + '"]')]
            .some(r => !r.classList.contains("hidden"));
          gh.classList.toggle("hidden", !any);
        });
        const n = c.querySelector(".rcount");
        if (n){
          const vis = [...rows].filter(r => !r.classList.contains("hidden"));
          const qd  = vis.filter(r => r.classList.contains("queued")).length;
          n.textContent = countLabel(vis.length - qd, qd);
        }
      } else {
        show = !q || c.dataset.q.includes(q);
      }
      c.classList.toggle("hidden", !show);
      if (show) any = true;
    });
    sec.classList.toggle("hidden", !any);
  });
});

/* ---- hydrate the price marks -------------------------------------------
   Fetched after first paint, so a failure costs nothing: the tile is already
   on screen off the seeded baselines. On success the whole review section is
   replaced -- cheaper and less error-prone than patching cells in place --
   and the filter is re-applied so an active query is not silently cleared.
   no-store because Pages sets a long max-age and a day-old file would defeat
   the point of a daily mark.                                                */
fetch("prices.json", { cache: "no-store" })
  .then(r => (r.ok ? r.json() : null))
  .then(j => {
    if (!j || !j.series) return;
    PRICES = j.series;
    // The newest SESSION, not j.updated -- the file is written after the run,
    // so on a pre-open run those differ by a day and "marked to <write date>"
    // would claim a mark that is not there.
    ASOF = Object.values(j.series).flat().reduce((a, m) => (m.d > a ? m.d : a), "");
    const old = document.getElementById("revsec");
    if (!old) return;
    old.replaceWith(renderReviews(REVIEWS, QUEUE));
    if (searchEl.value.trim()) searchEl.dispatchEvent(new Event("input"));
  })
  .catch(() => { /* keep the baseline render */ });

/* ---- private section: decrypt-in-browser (WebCrypto) ---- */
const lockBtn = document.getElementById("lock");
const panel = document.getElementById("unlockPanel");
const passIn = document.getElementById("passIn");
const remember = document.getElementById("rememberK");
const unlockErr = document.getElementById("unlockErr");
let privateOn = false;

const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function keyFromPass(pass){
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b64d(PRIVATE_ENC.salt), iterations:300000, hash:"SHA-256"},
    km, {name:"AES-GCM", length:256}, true, ["decrypt"]);
}
async function decryptPrivate(key){
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64d(PRIVATE_ENC.iv)}, key, b64d(PRIVATE_ENC.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
function showPrivate(secs){
  const tail = document.getElementById("revsec");  // keep reviews pinned last
  for (const s of secs){ const el = renderSection(s); el.classList.add("psec"); host.insertBefore(el, tail); }
  privateOn = true; lockBtn.textContent = "🔓";
  panel.classList.add("hidden"); passIn.value = ""; unlockErr.textContent = "";
}
function hidePrivate(){
  document.querySelectorAll(".psec").forEach(e => e.remove());
  privateOn = false; lockBtn.textContent = "🔒";
}
async function tryUnlock(){
  unlockErr.textContent = "";
  try{
    const key = await keyFromPass(passIn.value.trim());
    const secs = await decryptPrivate(key);
    if (remember.checked){
      const raw = await crypto.subtle.exportKey("raw", key);
      localStorage.setItem("lp.k", btoa(String.fromCharCode(...new Uint8Array(raw))));
    }
    showPrivate(secs);
  } catch(e){ unlockErr.textContent = "Wrong passphrase"; }
}
/* 🔒 click: if this device holds a remembered key, one click reveals; else ask.
   Never auto-shows on page load (screen-share safe). 🔓 or Esc hides again. */
lockBtn.addEventListener("click", async () => {
  if (privateOn){ hidePrivate(); return; }
  const saved = localStorage.getItem("lp.k");
  if (saved){
    try{
      const key = await crypto.subtle.importKey("raw", b64d(saved), {name:"AES-GCM"}, false, ["decrypt"]);
      showPrivate(await decryptPrivate(key));
      return;
    } catch(e){ localStorage.removeItem("lp.k"); }
  }
  panel.classList.toggle("hidden");
  if (!panel.classList.contains("hidden")) passIn.focus();
});
document.getElementById("unlockBtn").addEventListener("click", tryUnlock);
passIn.addEventListener("keydown", e => { if (e.key === "Enter") tryUnlock(); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape"){ hidePrivate(); panel.classList.add("hidden"); }
});

document.getElementById("date").textContent =
  new Date().toLocaleDateString("en-US", { weekday:"long", month:"long", day:"numeric" });
</script>
</body>
