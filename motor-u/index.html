<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motor U — Electro-Mechanical Market Mastery</title>
<style>
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --surface2:#EAEEF2; --ink:#16222C; --ink2:#22384A;
  --muted:#6B7A88; --gold:#BE7A32; --gold-soft:#F3E5D5; --border:#DDE3E9; --shadow:0 1px 3px rgba(22,34,44,.08),0 4px 14px rgba(22,34,44,.06);
  --good:#2E7D51; --bad:#B23A3A; --warn:#B7791F;
  --chart1:#22384A; --chart2:#BE7A32; --chart3:#5B7A99; --chart4:#8FA6B8;
}
html[data-theme="dark"]{
  --bg:#0F1720; --surface:#16222C; --surface2:#1D2B38; --ink:#E8EDF2; --ink2:#C7D2DC;
  --muted:#8FA0AF; --gold:#D18F45; --gold-soft:#3A2E1E; --border:#24313E; --shadow:0 1px 3px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  --good:#59B384; --bad:#E07B7B; --warn:#D9A441;
  --chart1:#8FA6B8; --chart2:#D18F45; --chart3:#5B7A99; --chart4:#44586B;
}
*{box-sizing:border-box} html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 "Segoe UI",system-ui,Arial,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,.display{font-family:Georgia,"Times New Roman",serif;color:var(--ink);line-height:1.25}
h1{font-size:26px;margin:0} h2{font-size:22px;margin:26px 0 10px} h3{font-size:18px;margin:20px 0 8px} h4{margin:16px 0 6px}
a{color:var(--gold);text-decoration:none} a:hover{text-decoration:underline}
p{margin:10px 0} ul,ol{margin:8px 0 8px 22px;padding:0} li{margin:4px 0}
code{background:var(--surface2);padding:1px 5px;border-radius:4px;font-size:.9em}
.wrap{max-width:980px;margin:0 auto;padding:0 20px 80px}
header.app{position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--border);padding:10px 0;margin-bottom:18px}
.bar{max-width:980px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-family:Georgia,serif;font-size:20px;font-weight:bold;cursor:pointer;white-space:nowrap}
.brand .u{color:var(--gold)}
nav.main{display:flex;gap:4px;flex-wrap:wrap}
nav.main button{background:none;border:none;color:var(--ink2);font:14px "Segoe UI",system-ui;padding:7px 11px;border-radius:8px;cursor:pointer}
nav.main button:hover{background:var(--surface2)}
nav.main button.on{background:var(--ink2);color:var(--bg)}
html[data-theme="dark"] nav.main button.on{background:var(--gold);color:#16222C}
.pill{display:inline-block;min-width:20px;text-align:center;background:var(--gold);color:#fff;border-radius:10px;font-size:11px;padding:1px 6px;margin-left:5px;vertical-align:1px}
.spacer{flex:1}
.iconbtn{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--ink);font-size:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.grid.mods{grid-template-columns:repeat(auto-fill,minmax(215px,1fr))}
.modcard{position:relative;cursor:pointer;transition:transform .08s}
.modcard:hover{transform:translateY(-2px)}
.modcard.locked{opacity:.55;cursor:default}
.modcard .wk{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.modcard h3{margin:4px 0 6px;font-size:17px}
.modcard .sum{font-size:13px;color:var(--muted);min-height:38px}
.ring{position:absolute;top:14px;right:14px;width:40px;height:40px}
.ring text{font:11px "Segoe UI";fill:var(--ink)}
.lockmsg{font-size:12px;color:var(--warn);margin-top:8px}
.btn{background:var(--ink2);color:#fff;border:none;border-radius:9px;padding:9px 16px;font:15px "Segoe UI";cursor:pointer}
.btn:hover{filter:brightness(1.1)}
.btn.gold{background:var(--gold)} .btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.small{padding:5px 11px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.statrow{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0}
.stattile{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--gold);border-radius:10px;padding:10px 16px;min-width:150px;flex:1}
.stattile .v{font-family:Georgia,serif;font-size:24px;color:var(--ink)}
.stattile .l{font-size:12.5px;color:var(--muted);margin-top:2px}
.chip{display:inline-block;background:var(--gold-soft);color:var(--gold);border:1px solid var(--gold);border-radius:6px;font-size:10.5px;padding:0 5px;margin-left:6px;cursor:pointer;vertical-align:2px;white-space:nowrap}
.callout{border-radius:10px;padding:12px 16px;margin:14px 0;border-left:4px solid var(--gold);background:var(--surface2)}
.callout.key{border-color:var(--gold)} .callout.warning{border-color:var(--bad)} .callout.example{border-color:var(--chart3)}
.callout .tag{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
table.data{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
table.data th{background:var(--ink2);color:#fff;padding:7px 10px;text-align:left;font-weight:600}
html[data-theme="dark"] table.data th{background:var(--surface2);color:var(--ink)}
table.data td{padding:6px 10px;border-bottom:1px solid var(--border)}
.tablewrap{overflow-x:auto}
figure.chart{margin:16px 0;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px}
figure.chart figcaption{font-size:13.5px;color:var(--ink2);font-weight:600;margin-bottom:8px}
figure.chart svg{width:100%;height:auto;display:block}
.lesson{border:1px solid var(--border);border-radius:12px;margin:10px 0;background:var(--surface);overflow:hidden}
.lesson>button.head{width:100%;text-align:left;background:none;border:none;padding:14px 18px;font:16px Georgia,serif;color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:10px}
.lesson .mins{font:12px "Segoe UI";color:var(--muted);margin-left:auto}
.lesson .body{padding:2px 20px 18px;display:none}
.lesson.open .body{display:block}
.check{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--border)}
.check:last-child{border:none}
.check input{margin-top:4px;accent-color:var(--gold);width:16px;height:16px}
.check .why{font-size:12.5px;color:var(--muted)}
.qbox{max-width:760px}
.opt{display:block;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:11px 14px;margin:8px 0;font:15px "Segoe UI";color:var(--ink);cursor:pointer}
.opt:hover{border-color:var(--gold)}
.opt.correct{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.opt:disabled{cursor:default}
.feedback{border-radius:10px;padding:12px 16px;margin:12px 0;background:var(--surface2)}
.progressbar{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;margin:10px 0}
.progressbar>div{height:100%;background:var(--gold);transition:width .2s}
textarea{width:100%;min-height:110px;background:var(--surface);color:var(--ink);border:1px solid var(--border);border-radius:10px;padding:10px;font:15px "Segoe UI";resize:vertical}
.flash{max-width:640px;margin:0 auto;text-align:center}
.flashcard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:44px 30px;min-height:190px;display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:var(--shadow);font-family:Georgia,serif}
.flashcard.back{border-left:5px solid var(--gold)}
.meta{font-size:12.5px;color:var(--muted)}
.badge{display:inline-flex;flex-direction:column;align-items:center;gap:4px;width:104px;text-align:center;padding:10px 4px;border-radius:12px}
.badge .ic{font-size:30px;filter:grayscale(1);opacity:.35}
.badge.won .ic{filter:none;opacity:1}
.badge .nm{font-size:12px;font-weight:600}
.badge .ds{font-size:10.5px;color:var(--muted)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink2);color:#fff;border-radius:12px;padding:13px 22px;box-shadow:var(--shadow);z-index:100;font-size:15px;animation:pop .25s}
@keyframes pop{from{opacity:0;transform:translateX(-50%) translateY(12px)}to{opacity:1;transform:translateX(-50%)}}
.popover{position:absolute;z-index:60;background:var(--surface);border:1px solid var(--gold);border-radius:10px;padding:12px 14px;max-width:360px;box-shadow:var(--shadow);font-size:13px}
.popover .t{font-weight:600;margin-bottom:4px}
.popover .q{font-style:italic;color:var(--ink2);border-left:3px solid var(--gold);padding-left:8px;margin:6px 0}
.hint{background:var(--surface2);border-radius:8px;padding:8px 12px;margin:6px 0;font-size:14px}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.twocol{grid-template-columns:1fr}}
.weakrow{display:flex;justify-content:space-between;font-size:14px;padding:5px 0;border-bottom:1px solid var(--border)}
.help{margin:14px 0}
.help>button{background:none;border:none;color:var(--gold);cursor:pointer;font-size:13.5px;padding:0}
.help .body{display:none;font-size:14px;color:var(--ink2);background:var(--surface2);border-radius:10px;padding:12px 16px;margin-top:8px}
.help.open .body{display:block}
.tagchip{display:inline-block;background:var(--surface2);border-radius:6px;font-size:11px;padding:1px 7px;margin:0 4px 4px 0;color:var(--muted)}
.libitem{padding:10px 0;border-bottom:1px solid var(--border)}
.libitem:last-child{border:none}
.fam{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.guard{max-width:600px;margin:80px auto;text-align:center}
.streak{font-size:14px;color:var(--ink2);white-space:nowrap}
.scen-item{cursor:pointer;padding:12px 16px;border:1px solid var(--border);border-radius:10px;margin:8px 0;background:var(--surface);display:flex;justify-content:space-between;align-items:center;gap:10px}
.scen-item:hover{border-color:var(--gold)}
.done-mark{color:var(--good);font-size:13px;white-space:nowrap}
.crumb{font-size:13px;color:var(--muted);margin:6px 0 14px}
.crumb a{color:var(--muted)}
@media print{
  header.app,.noprint{display:none!important}
  body{background:#fff;color:#000}
  .card,.flashprint{box-shadow:none;border-color:#999}
  .flashprint{page-break-inside:avoid;border:1px solid #999;border-radius:8px;padding:10px 14px;margin:8px 0}
}
</style>
</head>

<div id="mu-gate"></div>
<script id="mu-app" type="text/plain">
'use strict';
/* ============ Motor U app shell ============ */
(function(){
const C = window.MOTOR_U_CONTENT;
const app = document.getElementById('app');
if(!C || !C.modules || !C.modules.length){
  app.innerHTML = '<div class="guard card"><h1>Motor <span style="color:#BE7A32">U</span></h1>'+
  '<p><strong>Content file not found.</strong></p>'+
  '<p>Motor-U.html needs <code>motor-u-content.js</code> sitting in the same folder. '+
  'If you moved or renamed it, put it back. If this folder lives in OneDrive, right-click the '+
  '<code>Learning</code> folder and choose <em>"Always keep on this device"</em> so it works offline.</p></div>';
  return;
}

/* ---------- storage ---------- */
const PFX='motorU.';
const LS={
  get(k,def){ try{const v=localStorage.getItem(PFX+k); return v==null?def:JSON.parse(v);}catch(e){return def;} },
  set(k,v){ localStorage.setItem(PFX+k,JSON.stringify(v)); },
  keys(){ const out=[]; for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i); if(k&&k.startsWith(PFX)) out.push(k);} return out; }
};
const SCHEMA_V=1;
(function migrate(){
  const v=LS.get('schemaVersion',null);
  if(v==null){ LS.set('schemaVersion',SCHEMA_V); }
  /* future migrations: if(v<2){...} */
})();

/* ---------- dates ---------- */
function fmtDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function today(){ const off=Number(localStorage.getItem(PFX+'debugDateOffset')||0); const d=new Date(); d.setDate(d.getDate()+off); return fmtDate(d); }
function addDays(ds,n){ const p=ds.split('-').map(Number); const d=new Date(p[0],p[1]-1,p[2]+n); return fmtDate(d); }
function dayDiff(a,b){ const pa=a.split('-').map(Number), pb=b.split('-').map(Number); return Math.round((new Date(pb[0],pb[1]-1,pb[2])-new Date(pa[0],pa[1]-1,pa[2]))/86400000); }

/* ---------- state accessors ---------- */
function getProgress(){ return LS.get('progress',{modules:{},overrideUnlockAll:false}); }
function saveProgress(p){ LS.set('progress',p); }
function mp(p,mid){ if(!p.modules[mid]) p.modules[mid]={readings:{},lessonsViewed:{},quizBest:0,quizAttempts:0,completedAt:null}; return p.modules[mid]; }
function getLeitner(){ return LS.get('leitner',{}); }
function getActivities(){ return LS.get('activities',{scenarios:{},ic:{}}); }
function getSettings(){ const s=LS.get('settings',null); if(s) return s;
  const dark=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
  const d={theme:dark?'dark':'light',dailyNewCards:15}; LS.set('settings',d); return d; }
function getStreak(){ return LS.get('streak',{lastDay:null,count:0,best:0}); }
function getStats(){ return LS.get('stats',{cardReviews:0}); }

const INTERVALS=[null,0,1,3,7,14]; // boxes 1..5

/* ---------- derived ---------- */
const MODS=C.modules.slice().sort((a,b)=>a.n-b.n);
const byId={}; MODS.forEach(m=>byId[m.id]=m);
function mastery(mid){ return mp(getProgress(),mid).quizBest||0; }
function moduleComplete(mid){ return mastery(mid)>=80; }
function unlocked(mid){
  const p=getProgress(); if(p.overrideUnlockAll) return true;
  const m=byId[mid]; if(!m) return false;
  if(m.n===1) return true;
  if(m.n===MODS.length) return MODS.slice(0,-1).every(x=>moduleComplete(x.id));
  return moduleComplete(MODS[m.n-2].id);
}
function allCards(){ const out=[]; MODS.forEach(m=>(m.flashcards||[]).forEach(c=>out.push({...c,moduleId:m.id,moduleN:m.n}))); return out; }
function cardById(id){ return allCards().find(c=>c.id===id); }
function dueCards(){
  const L=getLeitner(), t=today();
  return Object.keys(L).filter(id=>L[id].due<=t && cardById(id))
    .sort((a,b)=>(L[a].box-L[b].box)||(L[a].due<L[b].due?-1:1));
}
function introduceNewCards(){
  const L=getLeitner(); const t=today();
  const overdue=dueCards().length;
  if(overdue>40) return [];
  const intake=LS.get('cardIntake',{day:null,count:0});
  const usedToday=intake.day===t?intake.count:0;
  const budget=Math.max(0,(getSettings().dailyNewCards||15)-usedToday);
  if(!budget) return [];
  const fresh=allCards().filter(c=>unlocked(c.moduleId)&&!L[c.id]).slice(0,budget);
  fresh.forEach(c=>{ L[c.id]={box:1,due:t,reps:0,lapses:0}; });
  if(fresh.length){ LS.set('leitner',L); LS.set('cardIntake',{day:t,count:usedToday+fresh.length}); }
  return fresh.map(c=>c.id);
}
function answerCard(id,ok){
  const L=getLeitner(); const st=L[id]||{box:1,due:today(),reps:0,lapses:0};
  if(ok){ st.box=Math.min(st.box+1,5); st.due=addDays(today(),INTERVALS[st.box]); }
  else { st.box=1; st.lapses++; st.due=today(); }
  st.reps++; L[id]=st; LS.set('leitner',L);
  const s=getStats(); s.cardReviews++; LS.set('stats',s);
  bumpStreak(); checkBadges();
}
function quizItems(mid){ return (byId[mid].quiz||[]); }
function allQuizItems(){ const out={}; MODS.forEach(m=>(m.quiz||[]).forEach(q=>out[q.id]={...q,moduleId:m.id})); return out; }
function missedQids(){
  const log=LS.get('quizLog',[]); const all=allQuizItems(); const seen=new Set(); const out=[];
  for(let i=log.length-1;i>=0;i--){ (log[i].misses||[]).forEach(qid=>{ if(!seen.has(qid)&&all[qid]){seen.add(qid);out.push(qid);} }); }
  return out;
}
function weakTags(){
  const log=LS.get('quizLog',[]); const all=allQuizItems();
  const t={};
  log.forEach(a=>{ (a.qids||[]).forEach(qid=>{ const q=all[qid]; if(!q)return; (q.tags||[]).forEach(tag=>{ t[tag]=t[tag]||{n:0,miss:0}; t[tag].n++; }); });
    (a.misses||[]).forEach(qid=>{ const q=all[qid]; if(!q)return; (q.tags||[]).forEach(tag=>{ t[tag]=t[tag]||{n:0,miss:0}; t[tag].miss++; }); }); });
  return Object.keys(t).map(k=>({tag:k,n:t[k].n,miss:t[k].miss,rate:t[k].miss/Math.max(1,t[k].n)}))
    .filter(x=>x.miss>0).sort((a,b)=>b.rate-a.rate||b.miss-a.miss).slice(0,6);
}
function bumpStreak(){
  const s=getStreak(); const t=today();
  if(s.lastDay===t) return;
  s.count = s.lastDay && dayDiff(s.lastDay,t)===1 ? s.count+1 : 1;
  s.best=Math.max(s.best,s.count); s.lastDay=t; LS.set('streak',s);
}

/* ---------- badges ---------- */
function badgeEarned(rule){
  const p=getProgress(); const acts=getActivities(); const L=getLeitner();
  switch(rule.type){
    case 'quiz-pass-first': return MODS.some(m=>mp(p,m.id).quizBest>=80);
    case 'perfect-quiz': return LS.get('quizLog',[]).some(a=>a.scorePct===100&&a.mode==='module');
    case 'module-complete': return moduleComplete(rule.module);
    case 'modules-complete': return rule.modules.every(moduleComplete);
    case 'streak': return getStreak().best>=rule.days;
    case 'box5-cards': return Object.values(L).filter(x=>x.box===5).length>=rule.count;
    case 'card-reviews': return getStats().cardReviews>=rule.count;
    case 'scenarios-done': return Object.keys(acts.scenarios).length>=rule.count;
    case 'ic-done': return Object.keys(acts.ic).length>=rule.count;
    default: return false;
  }
}

/* ---------- charts (pure SVG) ---------- */
function chartSVG(sp){
  try{
    if(sp.kind==='bar') return barChart(sp);
    if(sp.kind==='league') return leagueChart(sp);
    if(sp.kind==='heatmap') return heatmap(sp);
    if(sp.kind==='waterfall') return waterfall(sp);
  }catch(e){ return '<p class="meta">[chart error: '+esc(e.message)+']</p>'; }
  return '';
}
function niceMax(v){ const p=Math.pow(10,Math.floor(Math.log10(v||1))); const n=v/p; const m=n<=1?1:n<=2?2:n<=5?5:10; return m*p; }
function fmtNum(v){ if(Math.abs(v)>=1e6) return (v/1e6).toFixed(1).replace(/\.0$/,'')+'M'; if(Math.abs(v)>=1e3) return (v/1e3).toFixed(1).replace(/\.0$/,'')+'k'; return (Math.round(v*10)/10).toString(); }
function barChart(sp){
  const cats=sp.categories, series=sp.series||[]; const W=680, mL=60, mR=14, mT=10, mB=54;
  const bw=(W-mL-mR)/cats.length; const H=260; const ih=H-mT-mB;
  const max=niceMax(Math.max(...series.flatMap(s=>s.values)));
  const cols=['var(--chart1)','var(--chart2)','var(--chart3)','var(--chart4)'];
  let tickN=4; if(max%4!==0){ if(max%5===0) tickN=5; else if(max<=4) tickN=Math.max(1,max); }
  let g='';
  for(let t=0;t<=tickN;t++){ const y=mT+ih-ih*t/tickN; g+='<line x1="'+mL+'" y1="'+y+'" x2="'+(W-mR)+'" y2="'+y+'" stroke="var(--border)" stroke-width="1"/>'+
    '<text x="'+(mL-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="10" fill="var(--muted)">'+fmtNum(max*t/tickN)+'</text>'; }
  cats.forEach((c,i)=>{
    const gx=mL+i*bw; const n=series.length; const w=Math.min(34,(bw-10)/n);
    series.forEach((s,si)=>{
      const v=s.values[i]||0; const h=ih*v/max; const x=gx+bw/2-(n*w)/2+si*w;
      g+='<rect x="'+x+'" y="'+(mT+ih-h)+'" width="'+(w-3)+'" height="'+h+'" rx="2" fill="'+cols[si%4]+'"/>';
    });
    g+='<text x="'+(gx+bw/2)+'" y="'+(mT+ih+16)+'" text-anchor="middle" font-size="10.5" fill="var(--ink2)" transform="'+(cats.length>8?('rotate(-32 '+(gx+bw/2)+' '+(mT+ih+16)+')'):'')+'">'+esc(c)+'</text>';
  });
  let leg='';
  if(series.length>1){ series.forEach((s,si)=>{ leg+='<rect x="'+(mL+si*150)+'" y="'+(H-14)+'" width="11" height="11" rx="2" fill="'+cols[si%4]+'"/><text x="'+(mL+si*150+16)+'" y="'+(H-4)+'" font-size="11" fill="var(--ink2)">'+esc(s.name)+'</text>'; }); }
  const unit=sp.unit?'<text x="'+(W-mR)+'" y="'+(H-4)+'" text-anchor="end" font-size="10.5" fill="var(--muted)">'+esc(sp.unit)+'</text>':'';
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img">'+g+leg+unit+'</svg>';
}
function leagueChart(sp){
  const es=sp.entries||[]; const W=680; const rh=26; const H=es.length*rh+8;
  const max=Math.max(...es.map(e=>e.value)); const lw=190, vw=64;
  let g='';
  es.forEach((e,i)=>{
    const y=4+i*rh; const bw=(W-lw-vw-20)*(e.value/max);
    g+='<text x="'+(lw-8)+'" y="'+(y+15)+'" text-anchor="end" font-size="12" fill="var(--ink)">'+(e.rank?e.rank+'. ':'')+esc(e.name)+'</text>'+
       '<rect x="'+lw+'" y="'+(y+2)+'" width="'+Math.max(2,bw)+'" height="'+(rh-8)+'" rx="3" fill="'+(i===0?'var(--chart2)':'var(--chart1)')+'"/>'+
       '<text x="'+(lw+Math.max(2,bw)+6)+'" y="'+(y+15)+'" font-size="11.5" fill="var(--ink2)">'+fmtNum(e.value)+(e.note?' · '+esc(e.note):'')+'</text>';
  });
  const unit=sp.unit?'<text x="'+(W-4)+'" y="'+(H-2)+'" text-anchor="end" font-size="10.5" fill="var(--muted)">'+esc(sp.unit)+'</text>':'';
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img">'+g+unit+'</svg>';
}
function heatmap(sp){
  const rows=sp.rows, cols=sp.cols; const W=680; const lw=200; const cw=(W-lw-10)/cols.length; const rh=24;
  const H=rows.length*rh+34; const {min,max}=sp.scale||{min:0,max:Math.max(...sp.cells.flat())};
  let g='';
  cols.forEach((c,j)=>{ g+='<text x="'+(lw+j*cw+cw/2)+'" y="16" text-anchor="middle" font-size="11" fill="var(--ink2)">'+esc(c)+'</text>'; });
  rows.forEach((r,i)=>{
    const y=24+i*rh;
    g+='<text x="'+(lw-8)+'" y="'+(y+15)+'" text-anchor="end" font-size="11.5" fill="var(--ink)">'+esc(r)+'</text>';
    cols.forEach((c,j)=>{
      const v=sp.cells[i][j]; const t=Math.max(0,Math.min(1,(v-min)/((max-min)||1)));
      g+='<rect x="'+(lw+j*cw+1)+'" y="'+(y+1)+'" width="'+(cw-2)+'" height="'+(rh-2)+'" rx="3" fill="var(--gold)" fill-opacity="'+(0.12+t*0.78).toFixed(2)+'"/>'+
         '<text x="'+(lw+j*cw+cw/2)+'" y="'+(y+15)+'" text-anchor="middle" font-size="10.5" fill="var(--ink)">'+fmtNum(v)+(sp.scale&&sp.scale.unit?sp.scale.unit:'')+'</text>';
    });
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img">'+g+'</svg>';
}
function waterfall(sp){
  const steps=sp.steps||[]; const W=680,H=280,mL=56,mR=14,mT=12,mB=60; const ih=H-mT-mB;
  let run=0; const boxes=[];
  steps.forEach(s=>{ if(s.kind==='total'){ boxes.push({label:s.label,y0:0,y1:s.value,total:true}); run=s.value; }
    else if(s.kind==='start'){ boxes.push({label:s.label,y0:0,y1:s.value,total:true}); run=s.value; }
    else { boxes.push({label:s.label,y0:run,y1:run+s.value}); run+=s.value; } });
  const max=niceMax(Math.max(...boxes.map(b=>Math.max(b.y0,b.y1))));
  const bw=(W-mL-mR)/boxes.length;
  let g='';
  for(let t=0;t<=4;t++){ const y=mT+ih-ih*t/4; g+='<line x1="'+mL+'" y1="'+y+'" x2="'+(W-mR)+'" y2="'+y+'" stroke="var(--border)"/>'+
    '<text x="'+(mL-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="10" fill="var(--muted)">'+fmtNum(max*t/4)+'</text>'; }
  boxes.forEach((b,i)=>{
    const x=mL+i*bw+8; const w=bw-16;
    const yTop=mT+ih-ih*Math.max(b.y0,b.y1)/max; const h=Math.max(3,ih*Math.abs(b.y1-b.y0)/max);
    g+='<rect x="'+x+'" y="'+yTop+'" width="'+w+'" height="'+h+'" rx="3" fill="'+(b.total?'var(--chart1)':'var(--chart2)')+'"/>'+
       '<text x="'+(x+w/2)+'" y="'+(yTop-5)+'" text-anchor="middle" font-size="10.5" fill="var(--ink2)">'+fmtNum(Math.abs(b.y1-b.y0))+'</text>'+
       '<text x="'+(x+w/2)+'" y="'+(mT+ih+16)+'" text-anchor="middle" font-size="10.5" fill="var(--ink2)" transform="rotate(-24 '+(x+w/2)+' '+(mT+ih+16)+')">'+esc(b.label)+'</text>';
    if(i<boxes.length-1&&!b.total){ const yc=mT+ih-ih*b.y1/max; g+='<line x1="'+(x+w)+'" y1="'+yc+'" x2="'+(mL+(i+1)*bw+8)+'" y2="'+yc+'" stroke="var(--muted)" stroke-dasharray="3 3"/>'; }
  });
  const unit=sp.unit?'<text x="'+(W-mR)+'" y="'+(H-4)+'" text-anchor="end" font-size="10.5" fill="var(--muted)">'+esc(sp.unit)+'</text>':'';
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img">'+g+unit+'</svg>';
}

/* ----- quiz ----- */
function startQuiz(mid,mode){
  let items;
  if(mode==='drill'){ const all=allQuizItems(); items=missedQids().map(q=>all[q]); }
  else items=quizItems(mid).slice();
  items=shuffle(items).map(q=>{
    if(q.type==='mc'){ const opts=shuffle(q.options.map((t,i)=>({t,ok:i===q.answer}))); return {...q,opts}; }
    return q;
  });
  S.quiz={mid,mode,items,idx:0,answered:false,correct:0,misses:[],selfGraded:null};
}
function vQuiz(mid,mode){
  if(!S.quiz||S.quiz.mode!==mode||(mode==='module'&&S.quiz.mid!==mid)) startQuiz(mid,mode);
  const q=S.quiz; const total=q.items.length;
  if(!total) return '<h1>Nothing to drill</h1><p>No missed questions yet — go fail something first.</p><button class="btn" data-nav="dashboard">Back</button>';
  if(q.idx>=total) return quizEnd();
  const it=q.items[q.idx];
  let html='<div class="crumb"><a href="#" data-nav="'+(mode==='drill'?'dashboard':'module/'+q.mid)+'">'+(mode==='drill'?'Dashboard':'Module')+'</a> / '+(mode==='drill'?'Missed-question drill':esc(byId[q.mid].title)+' quiz')+'</div>';
  html+='<div class="qbox"><div class="progressbar"><div style="width:'+(q.idx/total*100)+'%"></div></div>'+
    '<p class="meta">Question '+(q.idx+1)+' of '+total+' · '+(it.tags||[]).map(t=>'<span class="tagchip">'+esc(t)+'</span>').join('')+'</p>'+
    '<h3 style="margin-top:4px">'+it.stem+'</h3>';
  if(it.type==='mc'){
    html+=it.opts.map((o,i)=>{
      let cls='opt', dis='';
      if(q.answered){ dis='disabled'; if(o.ok) cls+=' correct'; else if(q.picked===i) cls+=' wrong'; }
      return '<button class="'+cls+'" '+dis+' data-act="pick" data-i="'+i+'">'+esc(o.t)+'</button>';
    }).join('');
  } else {
    html+='<textarea id="shortAns" placeholder="Say it out loud or type it — then reveal.">'+(q.draft||'')+'</textarea>';
    if(!q.answered) html+='<p><button class="btn" data-act="reveal">Reveal model answer</button></p>';
  }
  if(q.answered){
    const right = it.type==='mc' ? it.opts[q.picked].ok : q.selfGraded;
    if(it.type==='short'&&q.selfGraded===null){
      html+='<div class="feedback"><div class="tag meta">MODEL ANSWER</div>'+it.modelAnswer+
      '<p>How did you do? <button class="btn small" data-act="selfgrade" data-ok="1">✓ Got it</button> <button class="btn small ghost" data-act="selfgrade" data-ok="0">✗ Missed it</button></p></div>';
    } else {
      html+='<div class="feedback">'+(right?'<strong style="color:var(--good)">Correct.</strong> ':'<strong style="color:var(--bad)">Not quite.</strong> ')+
        (it.explanation||'')+' '+chip(it.cite)+'</div>'+
        '<p><button class="btn gold" data-act="next">'+(q.idx+1>=total?'See results':'Next question')+' →</button></p>';
    }
  }
  html+='</div>';
  return html;
}
function quizEnd(){
  const q=S.quiz; const pct=Math.round(q.correct/q.items.length*100);
  if(!q.logged){
    q.logged=true;
    const log=LS.get('quizLog',[]);
    log.push({moduleId:q.mid,mode:q.mode,ts:Date.now(),scorePct:pct,qids:q.items.map(i=>i.id),misses:q.misses});
    while(log.length>60) log.shift();
    LS.set('quizLog',log);
    if(q.mode==='module'){
      const p=getProgress(); const prog=mp(p,q.mid);
      prog.quizAttempts++;
      if(pct>prog.quizBest) prog.quizBest=pct;
      if(pct>=80&&!prog.completedAt) prog.completedAt=Date.now();
      saveProgress(p);
    }
    bumpStreak(); checkBadges();
  }
  const passed=pct>=80;
  const all=allQuizItems();
  return '<div class="qbox"><h1>'+(q.mode==='drill'?'Drill complete':'Quiz complete')+'</h1>'+
  '<div class="statrow"><div class="stattile"><div class="v">'+pct+'%</div><div class="l">'+q.correct+' of '+q.items.length+' correct</div></div></div>'+
  (q.mode==='module'?'<p>'+(passed?'🎉 <strong>Mastered.</strong> '+(byId[q.mid].n<MODS.length?'The next module is unlocked.':'That’s the full program — go buy a gearbox shop.'):'You need ≥80% to unlock the next module. Review the misses below and retake.')+'</p>':'')+
  (q.misses.length?'<h3>What you missed</h3>'+q.misses.map(id=>{const it=all[id]||q.items.find(x=>x.id===id);return it?'<div class="feedback"><strong>'+it.stem+'</strong><br>'+(it.explanation||it.modelAnswer||'')+' '+chip(it.cite)+'</div>':'';}).join(''):'<p>Perfect run. 🏆</p>')+
  '<p>'+(q.mode==='module'?'<button class="btn gold" data-act="retake">Retake (reshuffled)</button> <button class="btn ghost" data-nav="module/'+q.mid+'">Back to module</button>':'<button class="btn ghost" data-nav="dashboard">Back to dashboard</button>')+'</p></div>';
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  const nav1=e.target.closest('[data-nav]');
  const act=e.target.closest('[data-act]');
  const chipEl=e.target.closest('.chip[data-cite]');
  if(chipEl){ showPopover(chipEl); e.preventDefault(); return; }
  document.querySelectorAll('.popover').forEach(p=>p.remove());
  if(nav1){ e.preventDefault(); S.hints=0; S.reveal=false; if(nav1.dataset.nav.startsWith('quiz/')) S.quiz=null; if(nav1.dataset.nav==='cards') S.cards=null; if(nav1.dataset.nav==='drill') S.quiz=null; nav(nav1.dataset.nav); return; }
  if(!act) return;
  const a=act.dataset.act;
  if(a==='theme'){ const s=getSettings(); s.theme=s.theme==='dark'?'light':'dark'; LS.set('settings',s); applyTheme(); return; }
  if(a==='help'){ document.getElementById('helpPanel').classList.toggle('open'); return; }
  if(a==='lesson'){
    const box=act.closest('.lesson'); box.classList.toggle('open');
    const r=route(); if(r[0]==='module'){ const p=getProgress(); mp(p,r[1]).lessonsViewed[act.dataset.lid]=Date.now(); saveProgress(p); }
    return;
  }
  if(a==='reading'){
    const p=getProgress(); const prog=mp(p,act.dataset.mid);
    if(act.checked) prog.readings[act.dataset.rid]=Date.now(); else delete prog.readings[act.dataset.rid];
    saveProgress(p); bumpStreak(); checkBadges(); return;
  }
  if(a==='pick'){
    const q=S.quiz; if(q.answered) return;
    q.picked=Number(act.dataset.i); q.answered=true;
    const it=q.items[q.idx];
    if(it.opts[q.picked].ok) q.correct++; else q.misses.push(it.id);
    render(); return;
  }
  if(a==='reveal'){ const ta=document.getElementById('shortAns'); if(ta) S.quiz.draft=ta.value; S.quiz.answered=true; S.quiz.selfGraded=null; render(); return; }
  if(a==='selfgrade'){
    const q=S.quiz; q.selfGraded=act.dataset.ok==='1';
    if(q.selfGraded) q.correct++; else q.misses.push(q.items[q.idx].id);
    render(); return;
  }
  if(a==='next'){ const q=S.quiz; q.idx++; q.answered=false; q.picked=null; q.selfGraded=null; q.draft=''; render(); return; }
  if(a==='retake'){ S.quiz=null; render(); return; }
  if(a==='flip'){ S.cards.flipped=true; render(); return; }
  if(a==='card'){
    const cs=S.cards; const id=cs.queue.shift(); const ok=act.dataset.ok==='1';
    answerCard(id,ok); cs.done++; if(!ok){ cs.missed++; cs.queue.push(id); }
    cs.flipped=false; render(); return;
  }
  if(a==='hint'){ S.hints=(S.hints||0)+1; render(); return; }
  if(a==='revealScen'){ S.reveal=true; render(); return; }
  if(a==='scenDone'){ const acts=getActivities(); acts.scenarios[act.dataset.id]=Date.now(); LS.set('activities',acts); bumpStreak(); checkBadges(); render(); return; }
  if(a==='icDone'){ const acts=getActivities(); acts.ic[act.dataset.id]=Date.now(); LS.set('activities',acts); bumpStreak(); checkBadges(); render(); return; }
  if(a==='icRandom'){
    const pool=[]; MODS.forEach(m=>{ if(unlocked(m.id)) (m.icQuestions||[]).forEach(q=>pool.push(q.id)); });
    if(pool.length){ S.reveal=false; nav('ic/'+pool[Math.floor(Math.random()*pool.length)]); }
    return;
  }
  if(a==='print'){ window.print(); return; }
  if(a==='export'){
    const dump={}; LS.keys().forEach(k=>{ dump[k]=localStorage.getItem(k); });
    const blob=new Blob([JSON.stringify({app:'motor-u',exported:new Date().toISOString(),data:dump},null,1)],{type:'application/json'});
    const aEl=document.createElement('a'); aEl.href=URL.createObjectURL(blob); aEl.download='motor-u-progress-'+today()+'.json'; aEl.click();
    LS.set('lastExport',today()); setTimeout(render,300); return;
  }
  if(a==='import'){ document.getElementById('importFile').click(); return; }
  if(a==='override'){ const p=getProgress(); p.overrideUnlockAll=act.checked; saveProgress(p); render(); return; }
});
document.addEventListener('change',function(e){
  if(e.target.id==='importFile'&&e.target.files.length){
    const fr=new FileReader();
    fr.onload=function(){ try{
      const obj=JSON.parse(fr.result);
      if(!obj||obj.app!=='motor-u'||!obj.data) throw new Error('Not a Motor U export file');
      LS.keys().forEach(k=>localStorage.removeItem(k));
      Object.keys(obj.data).forEach(k=>{ if(k.startsWith(PFX)) localStorage.setItem(k,obj.data[k]); });
      toast('Progress imported ✓'); render();
    }catch(err){ toast('Import failed: '+esc(err.message)); } };
    fr.readAsText(e.target.files[0]);
  }
});
function showPopover(chipEl){
  document.querySelectorAll('.popover').forEach(p=>p.remove());
  const cite=CITES[Number(chipEl.dataset.cite)]; if(!cite) return;
  const s=SRCMAP[cite.src]||{};

    (cite.quote?'<div class="q">“'+esc(cite.quote)+'”</div>':'')+
    (cite.note?'<div class="meta">'+esc(cite.note)+'</div>':'');
  document.body.appendChild(d);
  const r=chipEl.getBoundingClientRect();

/* ---------- boot ---------- */
render();
})();

<script>
(function(){
  var ENC = JSON.parse(document.getElementById('mu-enc').textContent);
  var gate = document.getElementById('mu-gate');
  var KEYCACHE = 'motorU.k';
  // small values (salt/iv/cached key) - sync is fine
  var b64d = function(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); };
  // the ciphertext is ~900KB: let the browser decode it natively instead of
  // looping in JS, which blocked the main thread long enough to look like a hang
  var CTBUF = null;
  async function ctBuf(){
    if (CTBUF) return CTBUF;
    var r = await fetch('data:application/octet-stream;base64,' + ENC.ct);
    CTBUF = new Uint8Array(await r.arrayBuffer());
    return CTBUF;
  }
  function note(msg){
    gate.innerHTML = '<div class="mu-lock"><h1>Motor <span style="color:#BE7A32">U</span></h1>'+
      '<p>'+msg+'</p></div>';
  }

  function form(msg){
    gate.innerHTML = '<div class="mu-lock"><h1>Motor <span style="color:#BE7A32">U</span></h1>'+
      '<p>This course is encrypted. Enter your passphrase to unlock it on this device.</p>'+
      '<input id="mu-pass" type="password" autocomplete="current-password" placeholder="Passphrase">'+
      '<label><input id="mu-remember" type="checkbox" checked> remember on this device</label>'+
      '<button id="mu-go">Unlock</button> <span class="err" id="mu-err">'+(msg||'')+'</span></div>';
    document.getElementById('mu-go').onclick = go;
    document.getElementById('mu-pass').addEventListener('keydown', function(e){ if(e.key==='Enter') go(); });
    document.getElementById('mu-pass').focus();
  }

  function boot(){
    gate.remove();
    // content is now on window.MOTOR_U_CONTENT - run the parked app shell
    new Function(document.getElementById('mu-app').textContent)();
  }

  function runPlaintext(js){
    new Function(js)();               // sets window.MOTOR_U_CONTENT
    if(!window.MOTOR_U_CONTENT) throw new Error('content did not load');
    boot();
  }

  async function withKey(key, remember){
    var pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(ENC.iv)}, key, await ctBuf());
    if(remember){
      var raw = await crypto.subtle.exportKey('raw', key);
      try{ localStorage.setItem(KEYCACHE, btoa(String.fromCharCode.apply(null, new Uint8Array(raw)))); }catch(e){}
    }
    runPlaintext(new TextDecoder().decode(pt));
  }

  async function go(){
    var err = document.getElementById('mu-err');
    var pass = document.getElementById('mu-pass').value.trim();
    if(!pass) return;
    err.textContent = 'Unlocking...';
    try{
      var km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
      var key = await crypto.subtle.deriveKey(
        {name:'PBKDF2', salt:b64d(ENC.salt), iterations:ENC.iters, hash:'SHA-256'},
        km, {name:'AES-GCM', length:256}, true, ['decrypt']);
      await withKey(key, document.getElementById('mu-remember').checked);
    }catch(e){ err.textContent = 'Wrong passphrase'; }
  }

  // auto-unlock if this device already holds the key.
  // Deferred past first paint so the page is never a frozen blank screen.
  function autoUnlock(){
    var saved = null;
    try{ saved = localStorage.getItem(KEYCACHE); }catch(e){}
    if(!saved){ form(''); return; }
    note('Unlocking&hellip;');
    (async function(){
      try{
        var key = await crypto.subtle.importKey('raw', b64d(saved), {name:'AES-GCM'}, false, ['decrypt']);
        await withKey(key, false);
      }catch(e){
        try{ localStorage.removeItem(KEYCACHE); }catch(e2){}
        form('Saved key no longer works — enter your passphrase.');
      }
    })();
  }
  if (document.readyState === 'complete') setTimeout(autoUnlock, 0);
  else window.addEventListener('load', function(){ setTimeout(autoUnlock, 0); });
})();
</script>
